name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes (README, CLAUDE.md, ...) can't break any check below.
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    env:
      # scripts/run-with-nvm.sh calls `nvm use` when it finds an nvm
      # install and would otherwise pick up the runner's own preinstalled
      # nvm, which doesn't have the exact .nvmrc patch version cached and
      # fails the build before it even starts. actions/setup-node below
      # already puts the correct Node on PATH for the whole job; pointing
      # NVM_DIR somewhere with no nvm.sh makes the script's own guard
      # (`if [ -s "$NVM_DIR/nvm.sh" ]`) skip straight to that.
      NVM_DIR: /opt/no-nvm-here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    env:
      # Same reason as the checks job above.
      NVM_DIR: /opt/no-nvm-here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Mocked backend (tests/e2e-mocks) -- no Supabase or model API secrets needed.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
