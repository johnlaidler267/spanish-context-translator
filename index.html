<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Read Spanish with confidence. Click any word to see its meaning." />
    <!-- SVG first (crisp at any size, both browser themes); PNG for Safari/older browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Supabase is the origin the first catalog/auth requests go to; on mobile the DNS +
         TLS handshake alone is a meaningful slice of how long the Discover content takes
         to show up, and it used to start only once the bundle had parsed. Vite substitutes
         %VITE_SUPABASE_URL% at build time; a build without it left unsubstituted is already
         broken (src/lib/supabase.ts throws on startup), so the placeholder can't ship. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Wordmark + headlines: Alegreya (Huerta Tipografica, drawn for long-form literature). Article/read body: EB Garamond (OFL). UI: Libre Franklin -->
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>LexaLens</title>
    <!-- Apply saved theme before paint (key must match src/lib/theme-storage.ts) -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("lector-reading-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
